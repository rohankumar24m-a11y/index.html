<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q2 FY27 Trade Incentive Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #101314;
  --panel: #171b1d;
  --panel-2: #1d2224;
  --line: #2a3033;
  --line-soft: #23282a;
  --ink: #eef1f0;
  --ink-dim: #a7b0ad;
  --ink-faint: #6f7a77;
  --coral: #e8734a;
  --teal: #16a190;
  --purple: #8b6cd9;
  --green: #4caf7d;
  --amber: #e0b23e;
  --red: #d9615a;
  --radius: 14px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f1; --panel:#ffffff; --panel-2:#faf9f7; --line:#e3e0da; --line-soft:#ececE8;
    --ink:#1b1d1d; --ink-dim:#5b615e; --ink-faint:#8b918d;
  }
}
:root[data-theme="light"]{
  --bg:#f5f4f1; --panel:#ffffff; --panel-2:#faf9f7; --line:#e3e0da; --line-soft:#ececE8;
  --ink:#1b1d1d; --ink-dim:#5b615e; --ink-faint:#8b918d;
}
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',system-ui,sans-serif;}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 60px;}
::selection{background:var(--coral);color:#fff;}

/* ---------- Top bar ---------- */
.topbar{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--panel), var(--bg));
  padding:18px 0 16px;
  position:sticky; top:0; z-index:40;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  backdrop-filter: blur(6px);
}
.topbar-inner{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-dots{display:inline-flex; gap:3px;}
.brand-dots span{width:8px;height:8px;border-radius:50%;display:inline-block;}
.brand h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-0.01em;}
.brand .sub{font-size:12px; color:var(--ink-faint); margin-top:1px;}
.topbar-right{margin-left:auto; display:flex; gap:8px; align-items:center;}
.theme-toggle, .view-toggle button{
  background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
  border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer; font-weight:600;
  font-family:inherit;
}
.view-toggle{display:flex; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px;}
.view-toggle button{border:none; background:transparent; padding:7px 14px; border-radius:8px;}
.view-toggle button.active{background:var(--coral); color:#fff;}

/* ---------- Layout ---------- */
.layout{display:grid; grid-template-columns: 300px 1fr; gap:20px; margin-top:20px;}
@media (max-width: 900px){ .layout{grid-template-columns:1fr;} }

/* ---------- Roster panel ---------- */
.roster{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; height:fit-content; position:sticky; top:96px;}
@media (max-width:900px){ .roster{position:static;} }
.search-box{
  width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; color:var(--ink); font-size:14px; font-family:inherit; margin-bottom:10px;
}
.search-box:focus{outline:2px solid var(--teal); outline-offset:-1px;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.chip{
  font-size:11.5px; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel-2); color:var(--ink-dim); cursor:pointer; font-weight:600;
}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.roster-list{max-height:640px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; margin:0 -4px; padding:0 4px;}
.emp-row{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; cursor:pointer;
  border:1px solid transparent;
}
.emp-row:hover{background:var(--panel-2);}
.emp-row.active{background:var(--panel-2); border-color:var(--line);}
.emp-avatar{
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff; flex-shrink:0;
}
.emp-meta{min-width:0; flex:1;}
.emp-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.emp-office{font-size:11px; color:var(--ink-faint);}
.emp-pct{font-size:12px; font-weight:700; flex-shrink:0;}
.roster-count{font-size:11px; color:var(--ink-faint); margin-bottom:8px;}

/* ---------- Detail panel ---------- */
.detail{display:flex; flex-direction:column; gap:16px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
.hero{
  display:grid; grid-template-columns: 1.3fr 1fr; gap:0; overflow:hidden; padding:0;
}
@media (max-width:720px){ .hero{grid-template-columns:1fr;} }
.hero-left{padding:22px 24px; border-right:1px solid var(--line);}
@media (max-width:720px){ .hero-left{border-right:none; border-bottom:1px solid var(--line);} }
.hero-right{padding:22px 24px; background:var(--panel-2); display:flex; flex-direction:column; justify-content:center; gap:14px;}
.hero-id{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.hero-avatar{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;flex-shrink:0;}
.hero-name{font-size:20px; font-weight:700; margin:0;}
.hero-tags{display:flex; gap:6px; margin-top:4px;}
.tag{font-size:11px; padding:3px 8px; border-radius:6px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim); font-weight:600;}
.hero-stat-row{display:flex; gap:24px; margin-top:16px; flex-wrap:wrap;}
.hstat-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; font-weight:600;}
.hstat-val{font-size:22px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.money-label{font-size:11.5px; color:var(--ink-faint); font-weight:600;}
.money-val{font-size:34px; font-weight:700; font-family:'Space Grotesk',sans-serif; line-height:1.1; margin:4px 0 2px;}
.money-sub{font-size:12.5px; color:var(--ink-dim);}
.eligibility-banner{
  border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600; margin-top:2px; display:flex; align-items:center; gap:8px;
}
.elig-ok{background:rgba(76,175,125,.12); color:var(--green); border:1px solid rgba(76,175,125,.3);}
.elig-bad{background:rgba(217,97,90,.12); color:var(--red); border:1px solid rgba(217,97,90,.3);}

/* progress bars */
.bar-track{height:8px; background:var(--line-soft); border-radius:999px; overflow:hidden; position:relative;}
.bar-fill{height:100%; border-radius:999px; transition:width .25s ease;}

/* param grid */
.param-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (max-width:720px){ .param-grid{grid-template-columns:1fr;} }
.param-card{border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--panel-2);}
.param-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.param-name{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
.dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
.param-weight{font-size:11px; color:var(--ink-faint); font-weight:600;}
.param-payout{font-size:20px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.param-rows{font-size:12.5px; color:var(--ink-dim); margin-top:10px; display:flex; flex-direction:column; gap:4px;}
.param-rows .r{display:flex; justify-content:space-between;}
.param-rows b{color:var(--ink); font-weight:600;}
.btg-note{margin-top:10px; font-size:12px; padding:8px 10px; border-radius:8px; background:var(--bg); border:1px solid var(--line); color:var(--ink-dim);}
.btg-note b{color:var(--amber);}
.est-flag{font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--ink-faint); border:1px solid var(--line); border-radius:5px; padding:1px 6px; margin-left:6px;}

/* simulator */
.sim-row{padding:16px 0; border-bottom:1px solid var(--line-soft);}
.sim-row:last-child{border-bottom:none;}
.sim-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px; flex-wrap:wrap;}
.sim-title{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
.sim-value{font-size:13px; color:var(--ink-dim); font-weight:600;}
.sim-value b{color:var(--ink); font-family:'Space Grotesk',sans-serif; font-size:14px;}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px; background:var(--line-soft); outline:none; margin:6px 0 4px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--coral);
  border:3px solid var(--panel); box-shadow:0 0 0 1px var(--coral); cursor:pointer; margin-top:-1px;
}
input[type=range]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%; background:var(--coral); border:3px solid var(--panel); box-shadow:0 0 0 1px var(--coral); cursor:pointer;
}
.sim-scale{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint);}
.sim-reset{font-size:12px; color:var(--teal); cursor:pointer; font-weight:600; background:none; border:none; font-family:inherit; padding:0;}

.sim-summary{
  display:flex; gap:20px; align-items:center; flex-wrap:wrap; padding:18px 20px; border-radius:12px;
  background:linear-gradient(135deg, rgba(232,115,74,.12), rgba(22,161,144,.08)); border:1px solid var(--line); margin-top:4px;
}
.sim-summary .big{font-size:30px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.sim-summary .delta{font-size:13px; font-weight:700; padding:3px 9px; border-radius:999px;}
.delta-pos{background:rgba(76,175,125,.15); color:var(--green);}
.delta-neg{background:rgba(217,97,90,.15); color:var(--red);}
.delta-zero{background:var(--panel-2); color:var(--ink-faint);}

.ladder{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
.ladder-row{
  display:grid; grid-template-columns:80px 1fr auto; align-items:center; gap:14px;
  padding:12px 14px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line);
}
.ladder-row.ladder-next{border-color:var(--coral); background:rgba(232,115,74,.08);}
@media (max-width:560px){ .ladder-row{grid-template-columns:60px 1fr auto; gap:8px; padding:10px;} }
.ladder-slab{text-align:left;}
.ladder-pct{font-size:19px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.ladder-tag{font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--coral); margin-top:2px;}
.ladder-mid{min-width:0;}
.ladder-need{font-size:13.5px; font-weight:700;}
.ladder-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.ladder-money{font-size:16px; font-weight:700; font-family:'Space Grotesk',sans-serif; text-align:right; white-space:nowrap;}

.section-title{font-size:15px; font-weight:700; margin:0 0 4px;}
.section-sub{font-size:12.5px; color:var(--ink-faint); margin:0 0 16px;}

/* team table */
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);
  padding:9px 10px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; font-weight:700;
}
thead th:hover{color:var(--ink);}
tbody td{padding:10px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--panel-2);}
.table-wrap{overflow-x:auto; border-radius:10px;}
.mini-avatar{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;margin-right:8px; vertical-align:middle;}
.rank-badge{font-size:11px; color:var(--ink-faint); font-weight:700; width:22px; display:inline-block;}
.pill{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700;}
.pill-hi{background:rgba(76,175,125,.15); color:var(--green);}
.pill-mid{background:rgba(224,178,62,.15); color:var(--amber);}
.pill-lo{background:rgba(217,97,90,.15); color:var(--red);}

.summary-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
@media (max-width:720px){ .summary-strip{grid-template-columns:repeat(2,1fr);} }
.sstat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px;}
.sstat-label{font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:6px;}
.sstat-val{font-size:22px; font-weight:700; font-family:'Space Grotesk',sans-serif;}

.footnote{font-size:11.5px; color:var(--ink-faint); line-height:1.6; margin-top:6px;}
.disclaimer{
  font-size:12px; color:var(--ink-dim); background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:12px 14px; line-height:1.55; margin-top:4px;
}
.disclaimer b{color:var(--ink);}

.sync-badge{font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:999px; color:var(--ink-faint);}
.sync-badge.sync-live{color:var(--green);}
.sync-badge.sync-offline{color:var(--ink-faint);}
.sync-badge.sync-readonly{color:var(--amber);}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;
  padding-top: calc(20px + env(safe-area-inset-top,0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom,0px));
}
.modal{
  background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:540px;
  max-height:90vh; overflow-y:auto;
}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-close{background:none; border:none; color:var(--ink-faint); font-size:22px; cursor:pointer; line-height:1; padding:2px 6px;}
.modal-tabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line);}
.modal-tab{
  background:none; border:none; color:var(--ink-faint); font-weight:700; font-size:13px; padding:8px 4px; margin-right:14px;
  cursor:pointer; border-bottom:2px solid transparent; font-family:inherit;
}
.modal-tab.active{color:var(--ink); border-bottom-color:var(--coral);}
.modal-tab-panel.hidden{display:none;}
.mlabel{display:block; font-size:12px; font-weight:600; color:var(--ink-dim); margin:12px 0 5px;}
.minput{
  width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  color:var(--ink); font-size:14px; font-family:inherit;
}
.mtextarea{min-height:140px; font-family:ui-monospace,monospace; font-size:12.5px; resize:vertical; line-height:1.6;}
.mrow{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:480px){ .mrow{grid-template-columns:1fr;} }
.modal-submit{
  margin-top:16px; width:100%; background:var(--coral); color:#fff; border:none; border-radius:10px; padding:11px;
  font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
}
.modal-submit:disabled{opacity:.5; cursor:not-allowed;}
.modal-footer{display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--ink-faint);}
.modal-status-msg{font-size:12.5px; padding:8px 12px; border-radius:8px; margin-bottom:12px;}
.status-ok{background:rgba(76,175,125,.12); color:var(--green);}
.status-err{background:rgba(217,97,90,.12); color:var(--red);}

.hidden{display:none !important;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-dots"><span style="background:var(--teal)"></span><span style="background:var(--coral)"></span><span style="background:var(--purple)"></span></span>
      <div>
        <h1>Q2 FY27 Incentive Dashboard</h1>
        <div class="sub">Trade Team &middot; Territory Sales, live payout simulator</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="syncBadge" class="sync-badge sync-offline">&#9679; Connecting&hellip;</span>
      <button class="theme-toggle" id="updateBtn">&#9998; Update numbers</button>
      <div class="view-toggle" id="viewToggle">
        <button data-view="individual" class="active">Employee</button>
        <button data-view="team">Team</button>
      </div>
      <button class="theme-toggle" id="themeToggle">&#9728;&#65039; Theme</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="individualView" class="layout">
    <div class="roster">
      <input class="search-box" id="searchBox" placeholder="Search name...">
      <div class="chip-row" id="officeChips"></div>
      <div class="roster-count" id="rosterCount"></div>
      <div class="roster-list" id="rosterList"></div>
    </div>
    <div class="detail" id="detailPanel"></div>
  </div>

  <div id="teamView" class="hidden">
    <div class="summary-strip" id="teamSummary"></div>
    <div class="card">
      <h2 class="section-title">Team payout board</h2>
      <p class="section-sub">Click any row to jump to that person's simulator. Sort by clicking a column header.</p>
      <div class="table-wrap">
        <table id="teamTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="updateModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 class="section-title" style="margin:0;">Update revenue numbers</h2>
      <button id="closeModalBtn" class="modal-close">&times;</button>
    </div>
    <div id="modalStatus"></div>
    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="single">Single person</button>
      <button class="modal-tab" data-tab="bulk">Bulk paste</button>
    </div>
    <div id="tabSingle" class="modal-tab-panel">
      <label class="mlabel">Employee</label>
      <select id="singleEmpSelect" class="minput"></select>
      <div class="mrow">
        <div>
          <label class="mlabel">Trade value achieved (Lakhs)</label>
          <input type="number" step="0.01" id="singleAchTrade" class="minput" placeholder="e.g. 92.4">
        </div>
        <div>
          <label class="mlabel">Institutional value achieved (Lakhs)</label>
          <input type="number" step="0.01" id="singleAchInsti" class="minput" placeholder="optional">
        </div>
      </div>
      <p class="section-sub" style="margin-top:8px;">Targets stay as published in the circular unless you enter new ones below.</p>
      <div class="mrow">
        <div>
          <label class="mlabel">Trade target (Lakhs) &mdash; optional</label>
          <input type="number" step="0.01" id="singleTgtTrade" class="minput" placeholder="leave blank to keep original">
        </div>
        <div>
          <label class="mlabel">Institutional target (Lakhs) &mdash; optional</label>
          <input type="number" step="0.01" id="singleTgtInsti" class="minput" placeholder="leave blank to keep original">
        </div>
      </div>
      <button id="singleSubmitBtn" class="modal-submit">Save &amp; push to everyone</button>
    </div>
    <div id="tabBulk" class="modal-tab-panel hidden">
      <label class="mlabel">Paste one line per person: <code>Name, Trade Achieved[, Institutional Achieved]</code></label>
      <textarea id="bulkText" class="minput mtextarea" placeholder="Nishchal Burnwal, 92.4
Aman Kumar, 78.1, 12.5
Roshan Kumar, 105.2"></textarea>
      <button id="bulkSubmitBtn" class="modal-submit">Save all &amp; push to everyone</button>
      <div id="bulkResult" class="section-sub" style="margin-top:8px;"></div>
    </div>
    <div class="modal-footer">
      <span id="overrideCount"></span>
      <button id="clearOverridesBtn" class="sim-reset">Reset everyone to original circular numbers</button>
    </div>
  </div>

  'TSE':    {p100:23500, p200:47000, label:'Territory Sales Executive'},

  'ATSM':   {p100:26000, p200:52000, label:'Asst. Territory Sales Manager'},

const fmtPct = n => (n*100).toFixed(1) + '%';
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ============ POLICY FORMULAS (verified against source workbook) ============ */

// Parameter 1: Revenue (GSR Value) — 50% weight — EXACT slab formula from circular
function revenuePayoutPct(achFrac){
  const a = achFrac*100;
  if (a < 60) return 0;
  if (a < 70) return (50 + (a-60)*1)/100;
  if (a < 80) return (60 + (a-70)*1)/100;
  if (a < 90) return (70 + (a-80)*1)/100;
  if (a < 100) return (80 + (a-90)*1)/100;
  if (a < 110) return (100 + (a-100)*2)/100;
  if (a < 120) return (150 + (a-110)*2)/100;
  return 2.0;
}

// Parameter 4: Contractor activation — 10% weight — EXACT stepped table from circular
function contractorPayoutPct(count){
  if (count >= 9) return 2.0;
  if (count === 8) return 1.5;
  if (count === 7) return 1.25;
  if (count === 6) return 1.0;
  if (count === 5) return 0.8;
  if (count <= 0) return 0;
  return (count/5) * 0.8; // estimated ramp below the first published tier
}

// Visit multiplier — EXACT table from circular
function visitPayoutPct(avg){
  if (avg >= 7) return 1.05;
  if (avg >= 6) return 1.00;
  if (avg >= 5) return 0.90;
  return 0.80;
}

// CEI multiplier — EXACT table from circular
function ceiPayoutPct(ceiFrac){
  const c = ceiFrac*100;
  if (c >= 98) return 1.10;
  if (c >= 90) return 1.00;
  if (c >= 85) return 0.95;
  if (c >= 80) return 0.90;
  if (c >= 70) return 0.80;
  if (c >= 60) return 0.70;
  return 0.50;
}

// Parameter 2: Active Dealer Billing — 20% weight — EXACT, reconstructed and verified
// against all 35 employees' actual computed payouts (34/35 exact, 1 boundary rounding case).
// Below each person's own 75%-target dealer count: 0%. Between 75%-target and 100%-target: flat 75%.
// At/above the 100%-target, each extra dealer billed climbs a tier ladder whose steepness
// depends on which Q1 baseline bucket (low / mid / top) the person started Q2 in.
function dealerTierOf(slab){
  if (!slab) return null;
  if (slab.includes('<15') || slab.includes('<18') || slab.includes('<20')) return 'low';
  if (slab.includes('15-24') || slab.includes('18-24') || slab.includes('21-29')) return 'mid';
  if (slab.includes('>=25') || slab.includes('>=30')) return 'top';
  return null;
}
function dealerPayoutPct(q2ach, t75, t100, slab){
  if (t75 == null || t100 == null) return 0;
  if (q2ach < t75) return 0;
  if (q2ach < t100) return 0.75;
  const delta = q2ach - t100;
  if (delta <= 0) return 1.0;
  const tier = dealerTierOf(slab);
  if (tier === 'low'){
    if (delta >= 4) return 2.0;
    if (delta >= 3) return 1.5;
    if (delta >= 2) return 1.3;
    return 1.2;
  }
  if (tier === 'mid'){
    if (delta >= 3) return 2.0;
    if (delta >= 2) return 1.5;
    return 1.3;
  }
  // top
  if (delta >= 2) return 2.0;
  return 1.5;
}

// Parameter 3: Range Selling — 20% weight — EXACT, reconstructed and verified against
// all 36 employees' actual computed payouts (36/36 exact match). Buckets below "12-15"
// use fixed circular thresholds; "12-15" and "15 & Above" buckets use the person's own
// Q1 range-billing number as the 100% target.
function rangePayoutPct(bucket, q1, q2){
  let t75, t100;
  if (bucket === 'less than 10'){ t75 = 10; t100 = 11; }
  else if (bucket === '10-12'){ t75 = 11; t100 = q1; }
  else if (bucket === '12-15'){ t75 = null; t100 = q1; }
  else if (bucket === '15 & Above'){ t75 = null; t100 = q1; }
  else return 0;

  if (t75 !== null && q2 < t75) return 0;
  if (q2 < t100) return t75 !== null ? 0.75 : 0;
  if (bucket === '15 & Above') return q2 >= t100+1 ? 2.0 : 1.0;
  if (q2 >= t100+2) return 2.0;
  if (q2 >= t100+1) return 1.5;
  return 1.0;
}

/* ============ COMPOSITE CALC ============ */
function computeOutcome(e, overrides){
  const o = overrides || {};
  // Revenue achievement uses whichever is higher of trade-only or trade+institution
  // achievement (the circular's own "Max achv" logic — combined targets apply to TSE/TSM).
  const revAch   = o.revAch   != null ? o.revAch   : e.rev_maxachv;
  const dealAch  = o.dealAch  != null ? o.dealAch  : e.deal_q2ach;
  const rngAch   = o.rngAch   != null ? o.rngAch   : e.rng_q2rb;
  const conCount = o.conCount != null ? o.conCount : e.con_total;
  const avgVisit = o.avgVisit != null ? o.avgVisit : e.avg_visit;
  const ceiPct   = o.ceiPct   != null ? o.ceiPct   : e.cei_pct;

  const eligible = revAch >= 0.60;

  const revPay  = eligible ? revenuePayoutPct(revAch) : 0;
  const dealPay = (eligible && e.deal_t75 != null) ? dealerPayoutPct(dealAch, e.deal_t75, e.deal_t100, e.deal_slab) : 0;
  const rngPay  = (eligible && e.rng_q1bucket != null) ? rangePayoutPct(e.rng_q1bucket, e.rng_q1rb, rngAch) : 0;
  const conPay  = (eligible && e.con_total != null) ? contractorPayoutPct(conCount) : 0;
  const visitPay = (e.avg_visit != null) ? visitPayoutPct(avgVisit) : 1.0;
  const ceiPay   = (e.cei_pct != null) ? ceiPayoutPct(ceiPct) : 1.0;

  const weighted = eligible ? (0.5*revPay + 0.2*(dealPay||0) + 0.2*(rngPay||0) + 0.1*(conPay||0)) : 0;
  const totalPayoutPct = eligible ? weighted * visitPay * ceiPay : 0;
  const potentialPct = eligible ? weighted * 1.05 * 1.10 : 0;

  const base = GRADE_BASE[e.type] || GRADE_BASE.TSE;
  const money = base.p100 * totalPayoutPct;
  const potentialMoney = base.p100 * potentialPct;

  return { revPay, dealPay, rngPay, conPay, visitPay, ceiPay, weighted, eligible, totalPayoutPct, potentialPct, money, potentialMoney, base };
}

// Range selling 75%/100% target markers, by Q1 bucket (mirrors rangePayoutPct above)
function rngT100(e){
  if (e.rng_q1bucket == null) return null;
  if (e.rng_q1bucket === 'less than 10') return 11;
  return e.rng_q1rb; // '10-12', '12-15', '15 & Above' all target the person's own Q1 number
}
function rngT75(e){
  if (e.rng_q1bucket == null) return null;
  if (e.rng_q1bucket === 'less than 10') return 10;
  if (e.rng_q1bucket === '10-12') return 11;
  return null; // '12-15' and '15 & Above' have no separate 75% marker
}

/* ============ LIVE SYNC (db capability) ============ */
let dbNS = null;
let userNS = null;
let canWrite = true;
const overriddenNames = new Set();

function slugify(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

// Recompute every field derived from the four raw revenue inputs (trade/insti target/achieved).
function recomputeRevenueDerived(e){
  e.rev_achpct_trade = e.rev_tgt_trade ? e.rev_ach_trade/e.rev_tgt_trade : 0;
  e.rev_tgt_total = e.rev_tgt_trade + (e.rev_tgt_insti||0);
  e.rev_ach_total = e.rev_ach_trade + (e.rev_ach_insti||0);
  e.rev_achpct_total = e.rev_tgt_total ? e.rev_ach_total/e.rev_tgt_total : 0;
  e.rev_maxachv = Math.max(e.rev_achpct_trade, e.rev_achpct_total);
  e.rev_btg100 = e.rev_tgt_trade*1.0 - e.rev_ach_trade;
  e.rev_btg110 = e.rev_tgt_trade*1.1 - e.rev_ach_trade;
}

function applyOverrideDoc(name, data){
  const e = EMP_DATA.find(x=>x.name===name);
  if (!e || !data) return;
  if (data.tgt_trade != null) e.rev_tgt_trade = data.tgt_trade;
  if (data.ach_trade != null) e.rev_ach_trade = data.ach_trade;
  if (data.tgt_insti != null) e.rev_tgt_insti = data.tgt_insti;
  if (data.ach_insti != null) e.rev_ach_insti = data.ach_insti;
  recomputeRevenueDerived(e);
  e._updatedAt = data.updatedAt;
  overriddenNames.add(name);
}

function setSyncBadge(state, label){
  const el = document.getElementById('syncBadge');
  if (!el) return;
  el.className = 'sync-badge sync-' + state;
  el.innerHTML = '&#9679; ' + label;
}

async function initLiveSync(){
  try {
    dbNS = await claude.use('db');
  } catch(err){ dbNS = null; }
  if (!dbNS){
    setSyncBadge('offline', 'This device only');
    document.getElementById('updateBtn').title = 'Live sync needs this page opened from its shared claude.ai link inside your organization.';
    return;
  }
  try {
    userNS = await claude.use('user');
    if (userNS && userNS.can){
      const w = await userNS.can('data.write');
      canWrite = (w === false) ? false : true;
    }
  } catch(err){ /* keep default */ }

  if (!canWrite){
    setSyncBadge('readonly', 'Live \u00b7 view only');
  } else {
    setSyncBadge('live', 'Live \u00b7 syncing');
  }

  try {
    dbNS.collection('revenue_overrides').onSnapshot(
      (snap) => {
        snap.docs.forEach(doc => {
          if (doc.exists) applyOverrideDoc(doc.data().name, doc.data());
        });
        renderRoster();
        if (getSelectedEmp()) renderDetail();
        if (!document.getElementById('teamView').classList.contains('hidden')) renderTeamView();
        const cnt = document.getElementById('overrideCount');
        if (cnt) cnt.textContent = `${overriddenNames.size} of ${EMP_DATA.length} people have live-updated numbers`;
      },
      (err) => { setSyncBadge('offline', 'Sync error'); }
    );
  } catch(err){ setSyncBadge('offline', 'Sync unavailable'); }
}

async function pushRevenueUpdate(name, payload){
  if (!dbNS) return { ok:false, msg:'Live sync is not available in this view.' };
  if (!canWrite) return { ok:false, msg:'You have view-only access to this dashboard.' };
  const e = EMP_DATA.find(x=>x.name===name);
  if (!e) return { ok:false, msg:`No one named "${name}" found in the roster.` };
  const body = { name, updatedAt: new Date().toISOString() };
  if (payload.ach_trade != null && !isNaN(payload.ach_trade)) body.ach_trade = payload.ach_trade;
  if (payload.ach_insti != null && !isNaN(payload.ach_insti)) body.ach_insti = payload.ach_insti;
  if (payload.tgt_trade != null && !isNaN(payload.tgt_trade)) body.tgt_trade = payload.tgt_trade;
  if (payload.tgt_insti != null && !isNaN(payload.tgt_insti)) body.tgt_insti = payload.tgt_insti;
  try {
    await dbNS.collection('revenue_overrides').doc(slugify(name)).set(body);
    return { ok:true };
  } catch(err){
    return { ok:false, msg: (err && err.message) || 'Save failed, please try again.' };
  }
}

async function clearAllOverrides(){
  if (!dbNS || !canWrite) return;
  const snap = await dbNS.collection('revenue_overrides').get();
  for (const doc of snap.docs){
    await doc.ref ? doc.ref.delete() : dbNS.collection('revenue_overrides').doc(doc.id).delete();
  }
}

    };
    const btn = document.getElementById('singleSubmitBtn');
    btn.disabled = true; btn.textContent = 'Saving\u2026';
    const res = await pushRevenueUpdate(name, payload);
    btn.disabled = false; btn.textContent = 'Save & push to everyone';
    showModalStatus(res.ok, res.ok ? `${name}'s numbers are live for everyone.` : res.msg);
    if (res.ok){
      document.getElementById('singleAchTrade').value='';
      document.getElementById('singleAchInsti').value='';
      document.getElementById('singleTgtTrade').value='';
      document.getElementById('singleTgtInsti').value='';
    }
  });

  document.getElementById('bulkSubmitBtn').addEventListener('click', async () => {
    const text = document.getElementById('bulkText').value.trim();
    if (!text) return;
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const btn = document.getElementById('bulkSubmitBtn');
    btn.disabled = true; btn.textContent = 'Saving\u2026';
    let ok=0, fail=[];
    for (const line of lines){
      const parts = line.split(',').map(s=>s.trim());
      const name = parts[0];
      const match = EMP_DATA.find(e => e.name.toLowerCase() === name.toLowerCase());
      if (!match){ fail.push(`"${name}" not found`); continue; }
      const payload = { ach_trade: parseFloat(parts[1]), ach_insti: parts[2]!=null ? parseFloat(parts[2]) : undefined };
      const res = await pushRevenueUpdate(match.name, payload);
      if (res.ok) ok++; else fail.push(`${match.name}: ${res.msg}`);
    }
    btn.disabled = false; btn.textContent = 'Save all & push to everyone';
    document.getElementById('bulkResult').innerHTML = `Updated <b>${ok}</b> of ${lines.length}.` + (fail.length ? `<br>Issues: ${fail.join('; ')}` : '');
    if (ok>0) document.getElementById('bulkText').value = '';
  });

  document.getElementById('clearOverridesBtn').addEventListener('click', async () => {
    if (!confirm('Reset every person\'s revenue numbers back to the original circular data? This affects everyone.')) return;
    await clearAllOverrides();
    location.reload();
  });
}

}

/* ============ CEI OPPORTUNITY ============ */
const CEI_TIERS = [
  {min:0.98, pct:1.10}, {min:0.90, pct:1.00}, {min:0.85, pct:0.95}, {min:0.80, pct:0.90},
  {min:0.70, pct:0.80}, {min:0.60, pct:0.70}, {min:0, pct:0.50},
];
function nextCeiTier(ceiPct){
  // returns the tier threshold just above current CEI%, or null if already at top
  const sorted = CEI_TIERS.slice().sort((a,b)=>a.min-b.min);
  for (const t of sorted){ if (t.min > ceiPct) return t; }
  return null;
}
function ceiIncentiveGap(e){
  const cur = computeOutcome(e, {});
  const atMax = computeOutcome(e, { ceiPct: 0.99 });
  const nextTier = nextCeiTier(e.cei_pct);
  const atNext = nextTier ? computeOutcome(e, { ceiPct: nextTier.min }) : cur;
  return {
    cur, maxMoney: atMax.money, maxGap: atMax.money - cur.money,
    nextTier, nextMoney: atNext.money, nextGap: atNext.money - cur.money,
  };
}
function renderCeiCard(e){
  const card = document.getElementById('ceiCard');
  if (e.cei_pct == null){

  const g = ceiIncentiveGap(e);

/* ============ REVENUE SLAB LADDER ============ */
// Every remaining slab boundary (60/70/80/90/100/110/120%) above the person's current
// counted achievement, with the extra trade value needed and the resulting total
// quarterly payout if every other parameter stays exactly where it is today.
function renderRevLadder(e){
  const card = document.getElementById('revLadderCard');
  const usesTotal = e.rev_achpct_total > e.rev_achpct_trade;
  const target = usesTotal ? e.rev_tgt_total : e.rev_tgt_trade;
  const achieved = usesTotal ? e.rev_ach_total : e.rev_ach_trade;
  const achPct = e.rev_maxachv;
  const basisLabel = usesTotal ? 'Trade + Institutional value' : 'Trade value';

  const thresholds = [60,70,80,90,100,110,120];
  const rows = thresholds
    .filter(t => t/100 > achPct + 0.0001)
    .map(t => {
      const neededValue = Math.max(0, (t/100)*target - achieved);
      const scenario = computeOutcome(e, { revAch: t/100 });
      return { t, neededValue, payoutAtT: revenuePayoutPct(t/100), money: scenario.money, eligible: scenario.eligible };
    });

  if (!rows.length){
    card.innerHTML = `
      <h2 class="section-title">Revenue slab ladder</h2>
      <p class="section-sub">Already past the top slab (120%+) on Revenue &mdash; capped at 200% payout for this parameter. No further value needed.</p>`;
    return;
  }

  const cur = computeOutcome(e, {});
  card.innerHTML = `
    <h2 class="section-title">Revenue slab ladder</h2>
    <p class="section-sub">Extra ${basisLabel.toLowerCase()} needed to clear each remaining slab, and the total quarterly payout you'd land on if everything else stayed exactly as it is today (currently ${fmtINR(cur.money)}).</p>
    <div class="ladder">
      ${rows.map((r,i) => `
        <div class="ladder-row ${i===0?'ladder-next':''}">
          <div class="ladder-slab">
            <div class="ladder-pct">${r.t}%</div>
            <div class="ladder-tag">${i===0 ? 'Next slab' : ''}</div>
          </div>
          <div class="ladder-mid">
            <div class="ladder-need">+${r.neededValue.toFixed(1)} L more value</div>
            <div class="ladder-sub">Revenue parameter payout becomes ${fmtPct(r.payoutAtT)}</div>
          </div>
          <div class="ladder-money">${fmtINR(r.money)}</div>
        </div>`).join('')}
    </div>
  `;
}

  const html = `<div class="sim-row">
    <div class="sim-head">
      <div class="sim-title"><span class="dot" style="background:${cfg.color}"></span>${cfg.label}</div>
      <div class="sim-value" id="${id}_val"><b>${cfg.display(cfg.value)}</b></div>
    </div>
    <input type="range" id="${id}" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${cfg.value}">
    <div class="sim-scale"><span>${cfg.display(cfg.min)}</span><span>${cfg.display(cfg.max)}</span></div>
  </div>`;
  const bind = () => {
    const input = document.getElementById(id);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      cfg.onInput(v);
      document.getElementById(id+'_val').innerHTML = `<b>${cfg.display(v)}</b>`;
      const e = getSelectedEmp();
      const out = computeOutcome(e, simOverrides);
      renderSimSummary(e, out);
      updateParamPayoutsOnly(e, out);
      renderRoster();
    });
  };
  return { html, bind };
}

function updateParamPayoutsOnly(e, out){
  renderParamGrid(e, out);
}

function renderSimSummary(e, out){
  const el = document.getElementById('simSummary');
  if (!el) return;
  const actual = computeOutcome(e, {});
  const diff = out.money - actual.money;
  const diffClass = diff>1 ? 'delta-pos' : diff<-1 ? 'delta-neg' : 'delta-zero';
  const diffLabel = diff>1 ? `+${fmtINR(diff)} vs today` : diff<-1 ? `${fmtINR(diff)} vs today` : 'same as today';
  el.innerHTML = `<div class="sim-summary">
    <div>
      <div class="money-label">Simulated payout</div>
      <div class="big">${out.eligible ? fmtINR(out.money) : fmtINR(0)}</div>
    </div>
    <div class="delta ${diffClass}">${diffLabel}</div>
    <div style="margin-left:auto; font-size:12.5px; color:var(--ink-dim);">
      Weighted score ${fmtPct(out.weighted)} &middot; Visit &times;${fmtPct(out.visitPay)} &middot; CEI &times;${fmtPct(out.ceiPay)}
      ${!out.eligible ? '<br><b style="color:var(--red)">Below 60% Revenue threshold &mdash; payout locked at \u20b90</b>' : ''}
    </div>
  </div>`;
}

/* ============ TEAM VIEW ============ */
function renderTeamView(){
  const results = EMP_DATA.map(e => ({ e, out: computeOutcome(e, {}), ceiGap: e.cei_pct!=null ? ceiIncentiveGap(e) : null }));
  const eligible = results.filter(r=>r.out.eligible);
  const totalMoney = results.reduce((s,r)=>s+r.out.money,0);
  const avgPct = eligible.length ? eligible.reduce((s,r)=>s+r.out.totalPayoutPct,0)/eligible.length : 0;
  const belowThreshold = results.filter(r=>!r.out.eligible).length;
  const totalCeiMissed = results.reduce((s,r)=> s + (r.ceiGap ? r.ceiGap.maxGap : 0), 0);

  document.getElementById('teamSummary').innerHTML = `
    <div class="sstat"><div class="sstat-label">Team members</div><div class="sstat-val">${EMP_DATA.length}</div></div>
    <div class="sstat"><div class="sstat-label">Total estimated payout</div><div class="sstat-val">${fmtINR(totalMoney)}</div></div>
    <div class="sstat"><div class="sstat-label">Average payout % (eligible)</div><div class="sstat-val">${fmtPct(avgPct)}</div></div>
    <div class="sstat"><div class="sstat-label">Missing due to CEI (to top tier)</div><div class="sstat-val" style="color:var(--amber)">${fmtINR(totalCeiMissed)}</div></div>
  `;

  const cols = [
    {k:'name', label:'Name'}, {k:'office', label:'Office'}, {k:'type', label:'Grade'},
    {k:'rev_achpct_trade', label:'Revenue %'}, {k:'weighted', label:'Weighted'},
    {k:'totalPayoutPct', label:'Payout %'}, {k:'money', label:'Payout \u20b9'},
    {k:'ceiMissed', label:'CEI missed \u20b9'},
  ];
  const thead = document.querySelector('#teamTable thead');
  thead.innerHTML = '<tr>' + cols.map(c=>`<th data-key="${c.k}">${c.label} ${sortKey===c.k ? (sortDir===1?'&#9650;':'&#9660;') : ''}</th>`).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.key;
    if (sortKey===k) sortDir *= -1; else { sortKey=k; sortDir=-1; }
    renderTeamView();
  }));

  const rowsData = results.map(r => ({
    name:r.e.name, office:r.e.office, type:r.e.type,
    rev_achpct_trade:r.e.rev_achpct_trade, weighted:r.out.weighted,
    totalPayoutPct:r.out.totalPayoutPct, money:r.out.money, e:r.e, eligible:r.out.eligible,
    ceiMissed: r.ceiGap ? r.ceiGap.maxGap : 0
  }));
  rowsData.sort((a,b)=>{
    const av=a[sortKey], bv=b[sortKey];
    if (typeof av === 'string') return sortDir===1 ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir===1 ? av-bv : bv-av;
  });

  const tbody = document.querySelector('#teamTable tbody');
  tbody.innerHTML = rowsData.map((r,i) => {
    const pillClass = !r.eligible ? 'pill-lo' : r.totalPayoutPct>=1 ? 'pill-hi' : r.totalPayoutPct>=0.7 ? 'pill-mid' : 'pill-lo';
    return `<tr data-name="${encodeURIComponent(r.name)}">
      <td><span class="rank-badge">${i+1}</span><span class="mini-avatar" style="background:${empColor(r.name)}">${initials(r.name)}</span>${r.name}</td>
      <td>${r.office}</td>
      <td>${r.type}</td>
      <td>${fmtPct(r.rev_achpct_trade)}</td>
      <td>${fmtPct(r.weighted)}</td>
      <td><span class="pill ${pillClass}">${r.eligible ? fmtPct(r.totalPayoutPct) : 'Not eligible'}</span></td>
      <td><b>${fmtINR(r.money)}</b></td>
      <td style="color:${r.ceiMissed>500?'var(--amber)':'var(--ink-faint)'}">${r.ceiMissed>10 ? fmtINR(r.ceiMissed) : '\u2014'}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => {
    selectedName = decodeURIComponent(tr.dataset.name);
    simOverrides = {};
    document.querySelector('#viewToggle button[data-view="individual"]').click();
    renderRoster();
    renderDetail();
  }));
}

/* ============ WIRE UP ============ */
document.getElementById('searchBox').addEventListener('input', e => { searchTerm = e.target.value; renderRoster(); });
document.getElementById('viewToggle').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if (!btn) return;
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const view = btn.dataset.view;
  document.getElementById('individualView').classList.toggle('hidden', view!=='individual');
  document.getElementById('teamView').classList.toggle('hidden', view!=='team');
  if (view==='team') renderTeamView();
});
document.getElementById('themeToggle').addEventListener('click', () => {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  root.setAttribute('data-theme', cur==='light' ? 'dark' : 'light');
});

/* ============ INIT ============ */
try {
  let saved = null;
  try { saved = localStorage.getItem('incentive_selected_emp'); } catch(err){}
  selectedName = (saved && EMP_DATA.some(e=>e.name===saved)) ? saved : EMP_DATA[0].name;
} catch(err) { selectedName = EMP_DATA[0].name; }
renderRoster();
renderDetail();
wireUpdateModal();
initLiveSync();

// persist selection per viewer (per-viewer convenience only)
setInterval(() => {
  try { if (selectedName) localStorage.setItem('incentive_selected_emp', selectedName); } catch(err){}
}, 4000);

</script>
</body>
</html>
